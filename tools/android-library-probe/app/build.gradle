plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.serialization' }
android {
 namespace 'com.example.workflow.libraryprobe'
 compileSdk 35
 defaultConfig { applicationId 'com.example.workflow.libraryprobe'; minSdk 29; targetSdk 35; versionCode 2; versionName '1.0-network-quality' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 lint { abortOnError true }
}
dependencies {
 implementation 'androidx.activity:activity-ktx:1.10.1'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
 implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
 implementation 'com.squareup.retrofit2:retrofit:2.11.0'
 implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
dependencyLocking { lockAllConfigurations(); lockMode = LockMode.STRICT }
