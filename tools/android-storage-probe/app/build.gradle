plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.google.devtools.ksp' }
android {
 namespace 'com.example.workflow.storageprobe'; compileSdk 35
 defaultConfig { applicationId 'com.example.workflow.storageprobe'; minSdk 29; targetSdk 35; versionCode 2; versionName '1.0-storage-quality' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 lint { abortOnError true }
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
 implementation 'androidx.activity:activity-ktx:1.10.1'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
 implementation 'androidx.room:room-runtime:2.7.2'
 implementation 'androidx.room:room-ktx:2.7.2'
 ksp 'androidx.room:room-compiler:2.7.2'
 implementation 'androidx.datastore:datastore-preferences:1.1.7'
 testImplementation 'junit:junit:4.13.2'
}
dependencyLocking { lockAllConfigurations(); lockMode = LockMode.STRICT }
