plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose'; id 'org.jetbrains.kotlin.plugin.serialization'; id 'com.google.devtools.ksp'; id 'com.google.dagger.hilt.android' }
android {
 namespace 'com.example.workflow.notes'; compileSdk 35
 defaultConfig { applicationId 'com.example.workflow.notes'; minSdk 29; targetSdk 35; versionCode 6; versionName '1.2.2-cancel-probe-quality' }
 buildFeatures { compose true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 lint { abortOnError true }
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
 implementation 'androidx.activity:activity-compose:1.10.1'
 implementation 'androidx.compose.foundation:foundation:1.8.3'
 implementation 'androidx.compose.material3:material3:1.3.2'
 implementation 'androidx.navigation:navigation-compose:2.9.1'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
 implementation 'androidx.room:room-runtime:2.7.2'
 implementation 'androidx.room:room-ktx:2.7.2'
 implementation 'androidx.datastore:datastore-preferences:1.1.7'
 implementation 'com.google.dagger:hilt-android:2.57.1'
 ksp 'androidx.room:room-compiler:2.7.2'
 ksp 'com.google.dagger:hilt-compiler:2.57.1'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
 implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
 implementation 'com.squareup.retrofit2:retrofit:2.11.0'
 implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
 implementation 'io.coil-kt.coil3:coil-compose:3.2.0'
 implementation 'io.coil-kt.coil3:coil-network-okhttp:3.2.0'
 implementation 'androidx.work:work-runtime-ktx:2.10.2'
 implementation 'androidx.hilt:hilt-work:1.2.0'
 ksp 'androidx.hilt:hilt-compiler:1.2.0'
 testImplementation 'junit:junit:4.13.2'
}
dependencyLocking { lockAllConfigurations(); lockMode = LockMode.STRICT }
