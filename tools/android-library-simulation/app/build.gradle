plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.google.devtools.ksp' }
android {
 namespace 'com.example.workflow.storageprobe'; compileSdk 35
 defaultConfig { applicationId 'com.example.workflow.librarysimulation'; minSdk 29; targetSdk 35; versionCode 1; versionName '1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'robolectric.enabledSdks', (project.findProperty('simulationApis') ?: '29,35').toString(); testLogging { showStandardStreams = true; exceptionFormat = 'full' } } } }
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
 implementation 'androidx.room:room-runtime:2.7.2'
 implementation 'androidx.room:room-ktx:2.7.2'
 ksp 'androidx.room:room-compiler:2.7.2'
 implementation 'androidx.datastore:datastore-preferences:1.1.7'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.18'
 testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

dependencyLocking {
 lockAllConfigurations()
 lockMode = LockMode.STRICT
 // Kotlin rewrites this common metadata module for the JVM runtime variant.
 // Locking it makes an otherwise identical second execution fail resolution.
 // Artifact checksum verification remains enabled for this module.
 ignoredDependencies.add('org.jetbrains.kotlin:kotlin-stdlib-common')
}
