plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'dev.mobilecodex.sample'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.mobilecodex.sample'
        minSdk 29
